[package]
name = "cerberus"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
clap = { version = "4.5", features = ["derive"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
[[bin]]
name = "update_readme"
path = "tools/update_readme.rs"