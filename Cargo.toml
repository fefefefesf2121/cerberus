[package]
name = "cerberus"
version = "1.2.5"
edition = "2021"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10.3"
dialoguer = "0.12.0"
console = "0.16.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
keyring = "3.6"
rand = "0.8"
walkdir = "2.5"
hex = "0.4"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = "symbols"