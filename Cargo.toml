[package]
name = "cerberus"
version = "1.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10.3"
dialoguer = "0.12.0"
console = "0.16.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
keyring = "3.0"  # Для безопасного хранения ключа
rand = "0.8"
walkdir = "2.5"
hex = "0.4"      # Чтобы превратить ключ в строку и обратно